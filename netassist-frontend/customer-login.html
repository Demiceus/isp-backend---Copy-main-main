<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Login — NetAssist AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/pro.css">
  <link rel="stylesheet" href="css/customer-login.css">
</head>

<body>
  <header class="login-header">
    <a class="brand" href="landing.html">
      <img src="netassistaillogo.png" alt="NetAssist AI Logo">
      <span>NetAssist <strong>AI</strong></span>
    </a>

    <a class="back-home" href="landing.html">
      Back to Home
    </a>
  </header>

  <main class="login-main">
    <form id="login" class="login-card" novalidate>

      <div class="portal-badge">
        <span class="status-dot"></span>
        Customer Portal
      </div>

      <h1>Log In to Your Account</h1>

      <p id="loginDescription" class="description">
        Log in with your email and PIN or password to contact support and leave feedback.
      </p>

      <div id="emailLogin">
        <label for="email">
          Email
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="username"
            required
          >
        </label>
      </div>

      <div id="accountLogin" style="display: none;">
        <label for="acc">
          Account Number
          <input
            id="acc"
            type="text"
            placeholder="e.g. ISP-10023"
            autocomplete="username"
          >
        </label>
      </div>

      <label for="pin">
        PIN / Password
        <input
          id="pin"
          type="password"
          autocomplete="current-password"
          required
        >
      </label>

      <div
        id="err"
        class="form-error"
        role="alert"
        aria-live="polite"
      ></div>

      <button id="go" type="submit">
        Log In
      </button>

      <button id="switchLogin" type="button">
        Having Trouble? Log In with Account Number
      </button>

      <p class="request-account">
        Don't have an account yet?
        <a href="customer-register.html">Request an Account</a>
      </p>

    </form>
  </main>

<script src="js/api.js"></script>

<script>
const existingCustomer = JSON.parse(
  localStorage.getItem("netassist_customer") || "null"
);

if (existingCustomer && existingCustomer.token) {
  location.href = "customer-portal.html";
}

const form = document.getElementById("login");
const emailLogin = document.getElementById("emailLogin");
const accountLogin = document.getElementById("accountLogin");

const emailInput = document.getElementById("email");
const accountInput = document.getElementById("acc");
const pinInput = document.getElementById("pin");

const errorBox = document.getElementById("err");
const loginButton = document.getElementById("go");
const switchLoginButton = document.getElementById("switchLogin");
const description = document.getElementById("loginDescription");

let loginType = "email";

/*
 * Switch between:
 * 1. Email + PIN/password (primary)
 * 2. Account number + PIN/password (reserve)
 */
switchLoginButton.addEventListener("click", () => {
  errorBox.textContent = "";

  if (loginType === "email") {
    loginType = "account";

    emailLogin.style.display = "none";
    accountLogin.style.display = "block";

    emailInput.required = false;
    accountInput.required = true;

    description.textContent =
      "Use your NetAssist account number and PIN / password as an alternative login method.";

    switchLoginButton.textContent =
      "← Log in with email instead";

    accountInput.focus();

  } else {
    loginType = "email";

    emailLogin.style.display = "block";
    accountLogin.style.display = "none";

    emailInput.required = true;
    accountInput.required = false;

    description.textContent =
      "Log in with your email and PIN / password to contact support and leave feedback.";

    switchLoginButton.textContent =
      "Having trouble? Log in with account number";

    emailInput.focus();
  }
});


form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = emailInput.value.trim().toLowerCase();
  const accountNumber = accountInput.value.trim();
  const pin = pinInput.value;

  errorBox.textContent = "";

  /*
   * Validate the selected login method.
   */
  if (loginType === "email" && !email) {
    errorBox.textContent = "Enter your email address.";
    emailInput.focus();
    return;
  }

  if (loginType === "email" && !email.includes("@")) {
    errorBox.textContent = "Enter a valid email address.";
    emailInput.focus();
    return;
  }

  if (loginType === "account" && !accountNumber) {
    errorBox.textContent = "Enter your account number.";
    accountInput.focus();
    return;
  }

  if (!pin) {
    errorBox.textContent = "Enter your PIN / password.";
    pinInput.focus();
    return;
  }

  /*
   * Prevent duplicate submissions.
   */
  loginButton.disabled = true;
  loginButton.innerHTML = '<span class="spin"></span>Logging in…';

  let result;

  if (loginType === "email") {
    result = await NetAssistAPI.customerLogin(
      email,
      pin,
      "email"
    );
  } else {
    result = await NetAssistAPI.customerLogin(
      accountNumber,
      pin,
      "account"
    );
  }

  /*
   * Login failed.
   */
  if (!result.ok) {
    errorBox.textContent =
      result.error || "Unable to log in. Please check your credentials.";

    loginButton.disabled = false;
    loginButton.textContent = "Log in";
    return;
  }

  /*
   * Successful login.
   *
   * The backend returns the customer's account number even
   * when they logged in using their email. This means the
   * rest of the customer portal can continue using the
   * account number internally without asking the customer
   * for it.
   */
  localStorage.setItem(
    "netassist_customer",
    JSON.stringify({
      account: result.data.account_number,
      name: result.data.name,
      email: result.data.email || email,
      token: result.data.token
    })
  );

  location.href = "customer-portal.html";
});
</script>

</body>
</html>
