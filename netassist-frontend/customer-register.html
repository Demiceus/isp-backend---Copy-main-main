<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request an account — NetAssist AI</title><link rel="stylesheet" href="css/pro.css"></head><body class="pro-bg">
<header class="pro-nav"><a class="logo" href="landing.html"><div class="logo-mark">N</div>NetAssist <span>AI</span></a><div class="nav-actions"><a class="pbtn ghost" href="customer-login.html">Back to login</a></div></header>
<main style="max-width:460px;margin:48px auto;padding:0 18px"><form id="reg" class="glass" style="padding:30px" novalidate>
<h1 style="font-size:24px">Request an account</h1><p style="font-size:13.5px;color:#667085;line-height:1.6;margin-top:6px">NetAssist reviews every request. You can log in once it is approved.</p>
<label style="display:block;margin-top:18px;font-size:12px;font-weight:750">Full name<input id="name" class="pinput" autocomplete="name" required></label>
<label style="display:block;margin-top:14px;font-size:12px;font-weight:750">Email<input id="email" type="email" class="pinput" autocomplete="email" required></label>
<label style="display:block;margin-top:14px;font-size:12px;font-weight:750">Choose a PIN (4+ characters)<input id="pin" type="password" class="pinput" autocomplete="new-password" required></label>
<div id="out" role="status" aria-live="polite" style="margin-top:12px"></div>
<button id="go" type="submit" class="pbtn primary" style="width:100%;margin-top:10px">Send request</button></form></main>
<script src="js/api.js"></script><script src="js/app.js"></script><script>
document.getElementById('reg').addEventListener('submit',async e=>{e.preventDefault();
 const $=id=>document.getElementById(id),o=$('out'),b=$('go');
 if(!$('name').value.trim()||!$('email').value.trim()||!$('pin').value){o.innerHTML='<div class="alert error" role="alert">Fill in every field.</div>';return}
 b.disabled=true;b.innerHTML='<span class="spin"></span>Sending…';
 const r=await NetAssistAPI.customerRegister({name:$('name').value.trim(),email:$('email').value.trim(),pin:$('pin').value});
 b.disabled=false;b.textContent='Send request';
 if(!r.ok){o.innerHTML='<div class="alert error" role="alert">'+escHtml(r.error)+'</div>';return}
 o.innerHTML='<div class="alert success">Request received. Your account number is <b>'+escHtml(r.data.account_number)+'</b>. Save it. You can log in after approval.</div>';$('reg').querySelectorAll('input').forEach(i=>i.value='')});
</script></body></html>
