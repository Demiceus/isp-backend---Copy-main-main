<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login — NetAssist AI</title><link rel="stylesheet" href="css/pro.css"></head><body class="pro-bg"><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><form id="login" class="glass" style="width:min(430px,100%);padding:32px"><div class="logo"><div class="logo-mark">N</div>NetAssist <span>AI</span></div><h1 style="font-size:30px;letter-spacing:-.04em;margin:30px 0 8px">Operations console</h1><p style="color:#667085;font-size:13px;line-height:1.6">Access the escalation and service analytics workspace.</p><label style="display:block;margin-top:24px;font-size:12px;font-weight:750">Username<input id="name" class="pinput" placeholder="admin" autocomplete="username" required></label><label style="display:block;margin-top:14px;font-size:12px;font-weight:750">Password<input id="pass" type="password" class="pinput" placeholder="••••••••" autocomplete="current-password" required></label><div id="err" class="form-error" role="alert"></div><button id="go" type="submit" class="pbtn primary" style="width:100%;margin-top:20px">Enter console</button><p style="font-size:11px;color:#94a3b8;margin-top:16px">Current backend authentication is not enabled; this portal gate is local UI session state only.</p></form></main><script src="js/api.js"></script><script>
if(localStorage.getItem('netassist_admin')&&JSON.parse(localStorage.getItem('netassist_admin')).token)location.href='admin-dashboard.html';
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();
const n=document.getElementById('name').value.trim(),p=document.getElementById('pass').value,err=document.getElementById('err'),b=document.getElementById('go');
if(!n||!p){err.textContent='Enter your username and password.';return}
err.textContent='';b.disabled=true;b.innerHTML='<span class="spin"></span>Signing in…';
const r=await NetAssistAPI.adminLogin(n,p);
if(!r.ok){err.textContent=r.error;b.disabled=false;b.textContent='Sign in';return}
localStorage.setItem('netassist_admin',JSON.stringify({name:r.data.name,role:r.data.role,token:r.data.token}));location.href='admin-dashboard.html'});
</script></body></html>
