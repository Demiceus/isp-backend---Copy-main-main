<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI assistant — NetAssist AI</title><link rel="stylesheet" href="css/pro.css"></head><body class="admin-bg"><div class="admin-shell"><aside class="admin-side"><a class="logo" href="landing.html"><div class="logo-mark">N</div>NetAssist <span>AI</span></a><nav class="admin-nav" aria-label="Admin"><a href="admin-dashboard.html">Overview</a><a href="admin-escalations.html">Escalation queue</a><a href="admin-issues.html">Customers by issue</a><a href="admin-customers.html">Customer accounts</a><a href="admin-assistant.html" class="active" aria-current="page">AI assistant</a></nav><div class="side-foot"><button id="logout" class="pbtn ghost" style="width:100%;background:rgba(255,255,255,.06);color:#dbe7ff;border-color:rgba(255,255,255,.1)">Log out</button></div></aside><main class="admin-main"><header class="admin-top"><div><div style="font-size:11px;color:#718096;font-weight:750">INSIGHTS</div><h1 style="font-size:21px;margin-top:3px">AI assistant</h1></div><div id="admin-name" style="font-size:13px;font-weight:750;color:#475569"></div></header>
<div class="admin-content"><div class="glass" style="padding:22px;max-width:900px">
<p class="lead" style="font-size:13px;color:#667085;margin-bottom:12px">Ask about complaints, escalations, reviews and customers. Answers come from your live database figures.</p>
<div class="chips" role="group" aria-label="Suggested questions"></div>
<div id="log" class="chat-window" role="log" aria-live="polite" aria-label="Conversation" style="margin-top:14px;min-height:280px"><div class="chat-msg ai">Hi! Ask me something like "How many internet connection problems do we have?"</div></div>
<form id="ask" class="chat-input" style="margin-top:12px"><label class="sr-only" for="q">Your question</label><input id="q" class="pinput" placeholder="Ask a question about your support data…" autocomplete="off" required><button id="go" class="pbtn primary" type="submit">Ask</button></form>
</div></div></main></div>
<script src="js/api.js"></script><script src="js/app.js"></script><script>
initAdmin();
const $=id=>document.getElementById(id),log=$('log');
const SUGGEST=["How many internet connection problems do we have?","What is the most common complaint?","How many open escalations do we have?","How many negative reviews do we have?","How many customers do we have?"];
document.querySelector('.chips').innerHTML=SUGGEST.map(t=>'<button type="button" class="chip">'+escHtml(t)+'</button>').join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('q').value=b.textContent;$('ask').requestSubmit()});
function add(c,t){const d=document.createElement('div');d.className='chat-msg '+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function typing(on){const o=$('typing');if(!on){if(o)o.remove();return}
 const t=document.createElement('div');t.id='typing';t.className='typing-bubble';t.setAttribute('role','status');t.setAttribute('aria-label','NetAssist AI is thinking');t.innerHTML='<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';log.appendChild(t);log.scrollTop=log.scrollHeight}
$('ask').addEventListener('submit',async e=>{e.preventDefault();
 const q=$('q').value.trim();if(!q)return;add('user',q);$('q').value='';$('q').disabled=$('go').disabled=true;typing(true);
 try{const r=await NetAssistAPI.askAdminAI(q);typing(false);
  if(!r.ok)add('error',r.error);else add('ai',(r.data&&r.data.answer)||'No answer returned.')}
 catch(err){typing(false);add('error','Could not reach the server.')}
 $('q').disabled=$('go').disabled=false;$('q').focus()});
</script></body></html>
